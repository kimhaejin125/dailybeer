<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>논알콜 판매 대시보드</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Hahmlet:wght@600;700&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap');
  :root{
    --bg:#F4F6F1; --card:#FFF; --line:#E2E6DB; --ink:#222820; --sub:#6E7565; --faint:#9AA192;
    --p6:#5C8A4E; --p12:#D9A13B; --ma:#39402F; --bad:#C4574E; --badbg:rgba(196,87,78,.08);
    --naver:#03C75A; --coupang:#E4572E;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans KR','Pretendard',-apple-system,sans-serif;padding:26px 18px 48px}
  .wrap{max-width:1080px;margin:0 auto}
  .eyebrow{font-size:12px;color:var(--faint);letter-spacing:.14em;margin-bottom:4px}
  h1{font-family:'Hahmlet',serif;font-size:27px;font-weight:700;margin:0;letter-spacing:-.01em}
  .range{font-size:12.5px;color:var(--sub);margin-top:5px}
  .head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
  .uploader{max-width:360px}
  .drop{border:1.5px dashed var(--faint);border-radius:14px;padding:12px 16px;background:var(--card);
        font-size:13px;color:var(--sub);cursor:pointer;text-align:center;transition:all .15s}
  .drop:hover,.drop.over{border-color:var(--ink);color:var(--ink);background:#FDFDFB}
  .drop b{color:var(--ink)}
  .drop .small{font-size:11px;color:var(--faint);margin-top:4px;line-height:1.5}
  #fileStatus{font-size:11.5px;margin-top:6px;color:var(--p6);font-weight:600;min-height:14px;text-align:center}
  #fileStatus.err{color:var(--bad)}
  #saveBtn{display:none;width:100%;margin-top:8px;padding:9px 14px;border-radius:12px;border:none;
           background:var(--ink);color:#FFF;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
  #saveBtn:hover{background:#000}
  .kpis{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0 14px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;flex:1 1 150px;min-width:150px}
  .kpi .lab{font-size:12px;color:var(--sub);margin-bottom:6px}
  .kpi .val{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600;letter-spacing:-.02em}
  .kpi .val .unit{font-family:'IBM Plex Sans KR',sans-serif;font-size:13px;color:var(--sub);font-weight:400;margin-left:3px}
  .kpi .sub{font-size:11.5px;color:var(--faint);margin-top:5px;line-height:1.45}
  .kpi.bad .val{color:var(--bad)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
  .cardhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
  .ttl{font-weight:700;font-size:15px}
  .ttl span{font-weight:400;font-size:12px;color:var(--faint);margin-left:8px}
  .segs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .seg{padding:6px 14px;border-radius:99px;font-size:12.5px;cursor:pointer;border:1px solid var(--line);
       background:var(--card);color:var(--sub);transition:all .15s;font-family:inherit}
  .seg.on{background:var(--ink);color:#FFF;border-color:var(--ink);font-weight:600}
  .vline{width:1px;align-self:stretch;background:var(--line);margin:0 4px}
  .row{display:flex;flex-wrap:wrap;gap:14px}
  .row .card{flex:1 1 400px;margin-bottom:0}
  .foot{font-size:11.5px;color:var(--faint);margin-top:16px;line-height:1.7}
  .chartbox{position:relative;height:300px}
  .chartbox.sm{height:250px}
  @media (max-width:560px){ .chartbox{height:240px} h1{font-size:22px} }

  .lock-panel{padding:12px 14px;background:#F8FBF6;border:1px solid var(--line);border-radius:12px}
  .lock-row{display:flex;gap:6px;align-items:center}
  .lock-row input[type=password]{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12px;font-family:inherit;outline:none;background:#fff}
  .lock-row input[type=password]:focus{border-color:var(--ink)}
  .lock-row button{padding:7px 14px;border-radius:8px;border:none;background:var(--ink);color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
  .lock-row button:hover{background:#000}
  #lockStatus{font-size:11px;color:var(--bad);margin-top:4px;min-height:13px}
  #adminContent{display:none}
  #adminContent.unlocked{display:block}
  .gsheet-panel{margin-top:10px;padding:12px 14px;background:#F8FBF6;border:1px solid var(--line);border-radius:12px}
  .gsheet-label{font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:6px}
  .gsheet-hint{font-weight:400;color:var(--faint);font-size:11px}
  .gsheet-row{display:flex;gap:6px}
  .gsheet-row input{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12px;font-family:inherit;outline:none;background:#fff}
  .gsheet-row input:focus{border-color:var(--ink)}
  .gsheet-row button{padding:7px 14px;border-radius:8px;border:none;background:var(--ink);color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
  .gsheet-row button:hover{background:#000}
  .gsheet-row button:disabled{background:var(--faint);cursor:not-allowed}
  #gsheetStatus{font-size:11.5px;margin-top:5px;min-height:14px;font-weight:600}
  #gsheetStatus.ok{color:var(--p6)}
  #gsheetStatus.err{color:var(--bad)}

</style>
</head>

async function sha256(str){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

async function unlockAdmin(){
  const pw = document.getElementById("lockPw").value;
  const hash = await sha256(pw);

    sessionStorage.setItem(SESSION_KEY, "1");
    showAdminContent();
  } else {
    const st = document.getElementById("lockStatus");
    st.textContent = "비밀번호가 맞지 않습니다";
    document.getElementById("lockPw").value = "";
  }
}

const STORAGE_KEY = "nonalcohol_gsheet_id";

function loadGSheetId(){
  return localStorage.getItem(STORAGE_KEY) || "";
}
function saveGSheetId(id){
  localStorage.setItem(STORAGE_KEY, id);
}

function extractSheetId(input){
  // URL 또는 순수 ID 입력 둘 다 처리
  const m = input.match(/\/d\/([a-zA-Z0-9_-]{20,})/);
  return m ? m[1] : (input.length > 20 ? input.trim() : "");
}

async function fetchGSheet(sheetId){
  const url = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv`;
  const res = await fetch(url);
  if(!res.ok) throw new Error(`구글 시트 응답 오류: ${res.status}`);
  const csv = await res.text();
  return parseCSV(csv);
}

function parseCSV(csv){
  const lines = csv.split(/\r?\n/).filter(l=>l.trim());
  if(lines.length < 2) throw new Error("데이터가 없습니다");
  
  // 헤더 파싱
  const header = splitCSVLine(lines[0]).map(h=>h.trim().replace(/^"|"$/g,""));
  
  // 필수 컬럼 확인
  const dateIdx = header.findIndex(h=>h==="날짜"||h==="date");
  const chIdx   = header.findIndex(h=>h==="channel"||h==="채널");
  const prIdx   = header.findIndex(h=>h==="product"||h==="상품");
  const qtyIdx  = header.findIndex(h=>h==="qty"||h==="수량");
  const noteIdx = header.findIndex(h=>h==="note"||h==="비고");
  
  if(dateIdx<0||chIdx<0||prIdx<0||qtyIdx<0){
    throw new Error(`필수 컬럼 없음\n필요: 날짜, channel, product, qty\n현재 헤더: ${header.join(", ")}`);
  }
  
  const recs = [];
  for(let i=1;i<lines.length;i++){
    const cols = splitCSVLine(lines[i]).map(c=>c.trim().replace(/^"|"$/g,""));
    const date = cols[dateIdx]?.trim();
    if(!date||!/^\d{4}-\d{2}-\d{2}/.test(date)) continue;
    recs.push({
      date: date.slice(0,10),
      channel: cols[chIdx]?.trim()||"",
      product: cols[prIdx]?.trim()||"",
      qty: Number(cols[qtyIdx])||0,
      note: noteIdx>=0 ? (cols[noteIdx]?.trim()||"") : ""
    });
  }
  return recs;
}

function splitCSVLine(line){
  // 쉼표 구분, 따옴표 내 쉼표 처리
  const result=[], re=/("(?:[^"]|"")*"|[^,]*)/g;
  let m;
  while((m=re.exec(line))!==null){
    if(m.index===re.lastIndex) re.lastIndex++;
    result.push(m[1].replace(/""/g,"\""));
  }
  return result;
}

async function connectGSheet(){
  const input = document.getElementById("gsheetInput").value.trim();
  const sheetId = extractSheetId(input);
  if(!sheetId){ alert("올바른 구글 시트 ID 또는 URL을 입력해주세요."); return; }
  
  const btn = document.getElementById("gsheetBtn");
  const status = document.getElementById("gsheetStatus");
  btn.disabled = true;
  btn.textContent = "연결 중…";
  status.textContent = "";
  status.className = "";
  
  try{
    const recs = await fetchGSheet(sheetId);
    if(!recs.length) throw new Error("데이터가 없습니다");
    store.clear();
    putRecords(recs);
    saveGSheetId(sheetId);
    status.textContent = `✅ ${recs.length}건 로드 완료`;
    status.className = "ok";
    document.getElementById("gsheetInput").value = sheetId;
    render();
  } catch(e){
    status.textContent = "❌ " + e.message;
    status.className = "err";
  } finally{
    btn.disabled = false;
    btn.textContent = "연결";
  }
}

/* ───────── 엑셀 파싱 ───────── */
function parseWorkbook(wb, fname){
  let added = 0; const recs = [];
  wb.SheetNames.forEach(sn=>{
    if(!/^\d{1,2}월$/.test(sn.trim())) return;
    const grid = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, raw:true});
    const hIdx = grid.findIndex(r => r && r.some(c => String(c).trim()==="날짜"));
    if(hIdx === -1) return;
    const header = grid[hIdx].map(c=>String(c??"").replace(/[\r\n]+/g," ").replace(/\s+/g," ").trim());
    const skip = new Set(["날짜","요일","주차","비고",""]);
    const prodCols = [];
    header.forEach((h,ci)=>{
      if(skip.has(h)||h.startsWith("합계")||h.includes("박스")) return;
      let channel="기타", product=h;
      const m = h.match(/^(네이버|쿠팡|스토어|스마트스토어)\s*(.*)$/);
      if(m){ channel = m[1]==="스마트스토어"||m[1]==="스토어" ? "네이버" : m[1]; product = m[2].trim()||h; }
      prodCols.push({ci, channel, product});
    });
    if(!prodCols.length) return;
    const dateCi = header.indexOf("날짜"), noteCi = header.indexOf("비고");
    for(let ri=hIdx+1; ri<grid.length; ri++){
      const row = grid[ri]; if(!row) continue;
      const dv = row[dateCi];
      let dateStr = null;
      if(typeof dv === "number" && dv > 20000){
        const t = new Date(Date.UTC(1899,11,30) + dv*86400000);
        dateStr = `${t.getUTCFullYear()}-${String(t.getUTCMonth()+1).padStart(2,"0")}-${String(t.getUTCDate()).padStart(2,"0")}`;
      } else if(typeof dv === "string" && /^\d{4}-\d{2}-\d{2}/.test(dv)) dateStr = dv.slice(0,10);
      if(!dateStr) continue;
      const note = noteCi >= 0 ? String(row[noteCi]??"").trim() : "";
      const allEmpty = prodCols.every(pc => row[pc.ci]===undefined || row[pc.ci]==="" || row[pc.ci]===null);
      if(allEmpty && !note) continue;
      prodCols.forEach(pc=>{
        const v = row[pc.ci];
        const qty = (typeof v==="number") ? v : (v==null||v==="" ? 0 : Number(v)||0);
        recs.push({date:dateStr, channel:pc.channel, product:pc.product, qty, note});
        added++;
      });
    }
  });
  if(!added) throw new Error("인식 가능한 시트가 없습니다 (시트명 '4월' 형식 + '날짜' 헤더 필요)");
  putRecords(recs);
  loadedFiles.push(fname);
  return added;
}

/* ───────── 업로드 + 내장본 저장 ───────── */
const drop = document.getElementById("drop"), fileInput = document.getElementById("fileInput"),
      fileStatus = document.getElementById("fileStatus"), saveBtn = document.getElementById("saveBtn");
drop.addEventListener("click", ()=>fileInput.click());
["dragover","dragenter"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("over");}));
["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("over");}));
drop.addEventListener("drop", e=>handleFiles(e.dataTransfer.files));
fileInput.addEventListener("change", e=>{handleFiles(e.target.files); fileInput.value="";});


saveBtn.addEventListener("click", ()=>{
  const today = new Date();
  const ds = `${today.getFullYear()}${String(today.getMonth()+1).padStart(2,"0")}${String(today.getDate()).padStart(2,"0")}`;
  const payload = {
    records: [...store.values()].sort((a,b)=>a.date.localeCompare(b.date)),
    files: loadedFiles.map(f=>f.replace(" (내장)","")),
    exportedAt: today.toISOString().slice(0,10),
  };
  const json = JSON.stringify(payload).replace(/</g,"\\u003c");
  const html = TEMPLATE.replace(
    /(<script type="application\/json" id="seed">)[\s\S]*?(<\/script>)/,
    (_, a, b) => a + json + b
  );
  const blob = new Blob([html], {type:"text/html;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `논알콜_판매_대시보드_${ds}.html`;
  a.click();
  URL.revokeObjectURL(a.href);
  fileStatus.className=""; fileStatus.textContent = `✓ 내장본 저장 완료 — 다음부터 그 파일을 열면 업로드 없이 최신 데이터가 보입니다`;
});

/* ───────── 집계 & 렌더 ───────── */
function getAll(){ return [...store.values()].sort((a,b)=>a.date.localeCompare(b.date)); }
function channels(){ return [...new Set(getAll().map(r=>r.channel))]; }
function months(){ return [...new Set(getAll().map(r=>Number(r.date.slice(5,7))))].sort((a,b)=>a-b); }

function buildDaily(recs){
  const byDate = new Map();
  recs.forEach(r=>{
    if(!byDate.has(r.date)) byDate.set(r.date,{date:r.date, dow:dowOf(r.date), total:0, parts:new Map(), stockout:false, notes:new Set()});
    const d = byDate.get(r.date);
    d.total += r.qty;
    const key = (selChannel==="전체") ? r.channel : r.product;
    d.parts.set(key,(d.parts.get(key)||0)+r.qty);
    if(r.note && r.note.includes("재고")) d.stockout = true;
    if(r.note) d.notes.add(r.note);
  });
  const days = [...byDate.values()].sort((a,b)=>a.date.localeCompare(b.date));
  days.forEach((d,i)=>{ const w=days.slice(Math.max(0,i-6),i+1); d.ma7=+(w.reduce((s,x)=>s+x.total,0)/w.length).toFixed(1); });
  return days;
}

function destroyCharts(){ Object.values(charts).forEach(c=>c&&c.destroy()); charts={}; }

const stockoutBand = {
  id:"stockoutBand",
  beforeDatasetsDraw(chart, _, opts){
    const ranges = opts.ranges||[]; if(!ranges.length) return;
    const {ctx, chartArea:{top,bottom}, scales:{x}} = chart;
    ctx.save();
    ranges.forEach(([i1,i2])=>{
      const half=(x.getPixelForValue(1)-x.getPixelForValue(0))/2 || 6;
      const x1=x.getPixelForValue(i1)-half, x2=x.getPixelForValue(i2)+half;
      ctx.fillStyle="rgba(196,87,78,.08)"; ctx.fillRect(x1,top,x2-x1,bottom-top);
      ctx.strokeStyle="rgba(196,87,78,.4)"; ctx.setLineDash([4,4]);
      ctx.strokeRect(x1,top,x2-x1,bottom-top);
      ctx.setLineDash([]); ctx.fillStyle="#C4574E"; ctx.font="600 11px 'IBM Plex Sans KR'";
      ctx.textAlign="center"; ctx.fillText("결품 (재고이슈)",(x1+x2)/2,top+14);
    });
    ctx.restore();
  }
};

function render(){
  const all = getAll();
  const chs = channels(), mos = months();
  if(!chs.includes(selChannel) && selChannel!=="전체") selChannel="전체";

  const chSeg = document.getElementById("channelSegs");
  chSeg.innerHTML = ["전체",...chs].map(c=>`<button class="seg ${selChannel===c?"on":""}" data-ch="${c}">${c}</button>`).join("");
  chSeg.querySelectorAll("button").forEach(b=>b.onclick=()=>{selChannel=b.dataset.ch;render();});
  const moSeg = document.getElementById("monthSegs");
  moSeg.innerHTML = ["전체",...mos.map(m=>m+"월")].map(m=>`<button class="seg ${selMonth===m?"on":""}" data-mo="${m}">${m}</button>`).join("");
  moSeg.querySelectorAll("button").forEach(b=>b.onclick=()=>{selMonth=b.dataset.mo;render();});

  const scoped = all.filter(r => selChannel==="전체" || r.channel===selChannel);
  const recsM = scoped.filter(r => selMonth==="전체" || Number(r.date.slice(5,7))===Number(selMonth.replace("월","")));

  const dates = [...new Set(scoped.map(r=>r.date))].sort();
  document.getElementById("dateRange").textContent =
    dates.length ? `${dates[0].replaceAll("-",".")} – ${dates.at(-1).replaceAll("-",".")} · 일별 판매수량 기준 · 채널: ${selChannel}` : "데이터 없음";

  const byDateAll = buildDailyForKpi(scoped);
  const sellable = byDateAll.filter(d=>!d.stockout);
  const total = byDateAll.reduce((s,d)=>s+d.total,0);
  const avg = sellable.length ? total/sellable.length : 0;
  const outDays = byDateAll.filter(d=>d.stockout).length;
  const prodTotals = new Map();
  scoped.forEach(r=>prodTotals.set(r.product,(prodTotals.get(r.product)||0)+r.qty));
  const topProd = [...prodTotals.entries()].sort((a,b)=>b[1]-a[1])[0];
  const chTotals = new Map();
  scoped.forEach(r=>chTotals.set(r.channel,(chTotals.get(r.channel)||0)+r.qty));

  document.getElementById("kpis").innerHTML = `
    <div class="kpi"><div class="lab">기간 총 판매</div><div class="val">${num(total)}<span class="unit">개</span></div>
      <div class="sub">${[...prodTotals.entries()].map(([p,v])=>`${p} ${num(v)}`).join(" · ")}</div></div>
    <div class="kpi"><div class="lab">일평균 (판매가능일)</div><div class="val">${avg.toFixed(1)}<span class="unit">개/일</span></div>
      <div class="sub">판매가능 ${sellable.length}일 기준 · 결품일 제외</div></div>
    <div class="kpi bad"><div class="lab">결품 일수</div><div class="val">${outDays}<span class="unit">일</span></div>
      <div class="sub">${outDays? "재고이슈 표기일 기준" : "결품 없음"}</div></div>
    <div class="kpi bad"><div class="lab">결품 기회손실</div><div class="val">≈${num(Math.round(avg*outDays))}<span class="unit">개</span></div>
      <div class="sub">일평균 × 결품일수 단순 추정</div></div>
    <div class="kpi"><div class="lab">${topProd? topProd[0]+" 비중":"-"}</div>
      <div class="val">${topProd&&total? Math.round(topProd[1]/total*100):0}<span class="unit">%</span></div>
      <div class="sub">${chs.length>1? [...chTotals.entries()].map(([c,v])=>`${c} ${num(v)}`).join(" · ") : "수량 기준"}</div></div>`;

  destroyCharts();
  const days = buildDaily(recsM);
  const keys = [...new Set(days.flatMap(d=>[...d.parts.keys()]))];
  const labels = days.map(d=>fmtMD(d.date));
  const ranges = [];
  let st=null;
  days.forEach((d,i)=>{ if(d.stockout&&st===null) st=i;
    if(d.stockout&&(!days[i+1]||!days[i+1].stockout)){ranges.push([st,i]);st=null;} });

  const grid = {color:"#E2E6DB"};
  const baseOpts = {responsive:true, maintainAspectRatio:false,
    plugins:{legend:{labels:{font:{size:11,family:"'IBM Plex Sans KR'"},boxWidth:12}}},
    scales:{x:{stacked:true,grid:{display:false},ticks:{font:{size:10},maxRotation:0,autoSkip:true}},
            y:{stacked:true,beginAtZero:true,grid,ticks:{font:{size:10},precision:0}}}};

  charts.daily = new Chart(document.getElementById("dailyChart"),{
    type:"bar",
    data:{labels, datasets:[
      ...keys.map((k,i)=>({label:k, data:days.map(d=>d.parts.get(k)||0),
        backgroundColor: CHCOLOR[k]||productColor(k,i), stack:"s", borderRadius:2, maxBarSize:16})),
      {type:"line", label:"7일 평균", data:days.map(d=>d.ma7), borderColor:"#39402F",
       borderWidth:2, pointRadius:0, tension:.3, yAxisID:"y"},
    ]},
    options:{...baseOpts,
      plugins:{...baseOpts.plugins, stockoutBand:{ranges},
        tooltip:{callbacks:{
          title:items=>{const d=days[items[0].dataIndex];
            return `${fmtMD(d.date)} (${d.dow})${d.stockout?" · 결품":""}${[...d.notes].filter(n=>!n.includes("재고")).map(n=>" · "+n).join("")}`;},
          footer:items=>{const d=days[items[0].dataIndex];return `합계 ${d.total}개`;}}}},
    },
    plugins:[stockoutBand],
  });

  const wk = new Map();
  recsM.forEach(r=>{
    const wkey = mondayOf(r.date);
    if(!wk.has(wkey)) wk.set(wkey,{parts:new Map(),total:0});
    const w=wk.get(wkey);
    const key = (selChannel==="전체") ? r.channel : r.product;
    w.parts.set(key,(w.parts.get(key)||0)+r.qty); w.total+=r.qty;
  });
  const wkeys=[...wk.keys()].sort();
  charts.weekly = new Chart(document.getElementById("weeklyChart"),{
    type:"bar",
    data:{labels:wkeys.map(k=>fmtMD(k)+"~"),
      datasets:keys.map((k,i)=>({label:k,data:wkeys.map(w=>wk.get(w).parts.get(k)||0),
        backgroundColor:CHCOLOR[k]||productColor(k,i),stack:"w",borderRadius:2,maxBarSize:30}))},
    options:{...baseOpts,
      plugins:{...baseOpts.plugins, tooltip:{callbacks:{footer:items=>`합계 ${wk.get(wkeys[items[0].dataIndex]).total}개`}}}},
  });

  const order=["월","화","수","목","금","토","일"];
  const allDaily = buildDaily(scoped);
  const dowAgg = order.map(dw=>{
    const rows = allDaily.filter(d=>d.dow===dw && !d.stockout);
    const m=new Map();
    rows.forEach(d=>d.parts.forEach((v,k)=>m.set(k,(m.get(k)||0)+v)));
    const n=rows.length||1;
    return {dw, parts:new Map([...m.entries()].map(([k,v])=>[k,+(v/n).toFixed(1)]))};
  });
  charts.dow = new Chart(document.getElementById("dowChart"),{
    type:"bar",
    data:{labels:order,
      datasets:keys.map((k,i)=>({label:k,data:dowAgg.map(d=>d.parts.get(k)||0),
        backgroundColor:CHCOLOR[k]||productColor(k,i),stack:"d",borderRadius:2,maxBarSize:34}))},
    options:baseOpts,
  });

  document.getElementById("foot").innerHTML =
    `반영된 데이터: ${loadedFiles.join(" → ")} (내장 기준일 ${SEEDDATA.exportedAt})<br>` +
    `같은 날짜·채널·상품 데이터는 최신 업로드 파일로 덮어쓰기됩니다.<br>` +
    `※ 새 엑셀을 올린 뒤 <b>"내장본 저장"</b> 버튼을 누르면 그 데이터가 박힌 새 HTML이 다운로드됩니다 — 다음부터는 그 파일을 열어 쓰세요.`;
}

function buildDailyForKpi(recs){
  const byDate=new Map();
  recs.forEach(r=>{
    if(!byDate.has(r.date)) byDate.set(r.date,{total:0,stockout:false});
    const d=byDate.get(r.date); d.total+=r.qty;
    if(r.note&&r.note.includes("재고")) d.stockout=true;
  });
  return [...byDate.values()];
}

render();
</script></body></html>
