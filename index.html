  :root{

  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans KR','Pretendard',-apple-system,sans-serif;padding:26px 18px 48px}
  .wrap{max-width:1080px;margin:0 auto}
  .eyebrow{font-size:12px;color:var(--faint);letter-spacing:.14em;margin-bottom:4px}
  h1{font-family:'Hahmlet',serif;font-size:27px;font-weight:700;margin:0;letter-spacing:-.01em}
  .range{font-size:12.5px;color:var(--sub);margin-top:5px}
  .head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
  #adminArea{max-width:360px}
  .lock-panel{padding:12px 14px;background:#F8FBF6;border:1px solid var(--line);border-radius:12px}
  .lock-row{display:flex;gap:6px}
  .lock-row input[type=password]{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12px;font-family:inherit;outline:none;background:#fff}
  .lock-row button{padding:7px 14px;border-radius:8px;border:none;background:var(--ink);color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
  #lockStatus{font-size:11px;color:var(--bad);margin-top:4px;min-height:13px}
  #adminInner{display:none;margin-top:10px}
  .gs-label{font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:6px}
  .gs-hint{font-weight:400;color:var(--faint);font-size:11px}
  .gs-row{display:flex;gap:6px}
  .gs-row input{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12px;font-family:inherit;outline:none;background:#fff}
  .gs-row button{padding:7px 14px;border-radius:8px;border:none;background:var(--ink);color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
  #gsStatus{font-size:11.5px;margin-top:5px;min-height:14px;font-weight:600}
  #gsStatus.ok{color:var(--p6)}
  #gsStatus.err{color:var(--bad)}
  .kpis{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0 14px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;flex:1 1 150px;min-width:150px}
  .kpi .lab{font-size:12px;color:var(--sub);margin-bottom:6px}
  .kpi .val{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600;letter-spacing:-.02em}
  .kpi .val .unit{font-family:'IBM Plex Sans KR',sans-serif;font-size:13px;color:var(--sub);font-weight:400;margin-left:3px}
  .kpi .sub{font-size:11.5px;color:var(--faint);margin-top:5px;line-height:1.45}
  .kpi.bad .val{color:var(--bad)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
  .cardhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
  .ttl{font-weight:700;font-size:15px}
  .ttl span{font-weight:400;font-size:12px;color:var(--faint);margin-left:8px}
  .segs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .seg{padding:6px 14px;border-radius:99px;font-size:12.5px;cursor:pointer;border:1px solid var(--line);
       background:var(--card);color:var(--sub);transition:all .15s;font-family:inherit}
  .seg.on{background:var(--ink);color:#FFF;border-color:var(--ink);font-weight:600}
  .vline{width:1px;align-self:stretch;background:var(--line);margin:0 4px}
  .row{display:flex;flex-wrap:wrap;gap:14px}
  .row .card{flex:1 1 400px;margin-bottom:0}
  .foot{font-size:11.5px;color:var(--faint);margin-top:16px;line-height:1.7}
  .chartbox{position:relative;height:300px}
  .chartbox.sm{height:250px}
  @media (max-width:560px){ .chartbox{height:240px} h1{font-size:22px} }
</style>

/* ── 상태 ── */
let selChannel="전체", selMonth="전체", charts={};

function destroyCharts(){ Object.values(charts).forEach(c=>c&&c.destroy()); charts={}; }

function buildDaily(recs){
  const byDate=new Map();
  recs.forEach(r=>{
    if(!byDate.has(r.date)) byDate.set(r.date,{date:r.date,dow:dowOf(r.date),total:0,parts:new Map(),stockout:false,notes:new Set()});
    const d=byDate.get(r.date);
    d.total+=r.qty;
    const key=(selChannel==="전체")?r.channel:r.product;
    d.parts.set(key,(d.parts.get(key)||0)+r.qty);
    if(r.note&&r.note.includes("재고")) d.stockout=true;
    if(r.note) d.notes.add(r.note);
  });
  const days=[...byDate.values()].sort((a,b)=>a.date.localeCompare(b.date));
  days.forEach((d,i)=>{ const w=days.slice(Math.max(0,i-6),i+1); d.ma7=+(w.reduce((s,x)=>s+x.total,0)/w.length).toFixed(1); });
  return days;
}

function buildDailyForKpi(recs){
  const byDate=new Map();
  recs.forEach(r=>{
    if(!byDate.has(r.date)) byDate.set(r.date,{total:0,stockout:false});
    const d=byDate.get(r.date); d.total+=r.qty;
    if(r.note&&r.note.includes("재고")) d.stockout=true;
  });
  return [...byDate.values()];
}

function render(){
  const all=getAll();
  const chs=channels(), mos=months();
  if(!chs.includes(selChannel)&&selChannel!=="전체") selChannel="전체";

  const chSeg=document.getElementById("channelSegs");
  chSeg.innerHTML=["전체",...chs].map(c=>`<button class="seg ${selChannel===c?"on":""}" data-ch="${c}">${c}</button>`).join("");
  chSeg.querySelectorAll("button").forEach(b=>b.onclick=()=>{selChannel=b.dataset.ch;render();});

  const moSeg=document.getElementById("monthSegs");
  moSeg.innerHTML=["전체",...mos.map(m=>m+"월")].map(m=>`<button class="seg ${selMonth===m?"on":""}" data-mo="${m}">${m}</button>`).join("");
  moSeg.querySelectorAll("button").forEach(b=>b.onclick=()=>{selMonth=b.dataset.mo;render();});

  document.getElementById("dateRange").textContent=
    all.length?`${Math.min(...all.map(r=>r.date))} ~ ${Math.max(...all.map(r=>r.date))}`:"";

  const scoped=all.filter(r=>selChannel==="전체"||r.channel===selChannel);
  const recsM=scoped.filter(r=>selMonth==="전체"||Number(r.date.slice(5,7))===Number(selMonth.replace("월","")));

  const byDateAll=buildDailyForKpi(scoped);
  const totQty=scoped.reduce((s,r)=>s+r.qty,0);
  const avgDay=byDateAll.length?+(totQty/byDateAll.filter(d=>d.total>0).length).toFixed(1):0;
  const stockDays=byDateAll.filter(d=>d.stockout).length;
  const prodTotals=new Map();
  scoped.forEach(r=>prodTotals.set(r.product,(prodTotals.get(r.product)||0)+r.qty));
  const chTotals=new Map();
  scoped.forEach(r=>chTotals.set(r.channel,(chTotals.get(r.channel)||0)+r.qty));

  const kpiEl=document.getElementById("kpis");
  const chKpis=[...chTotals.entries()].map(([ch,v])=>`<div class="kpi"><div class="lab">${ch} 총판매</div><div class="val">${v.toLocaleString()}<span class="unit">캔</span></div></div>`).join("");
  const prodKpis=[...prodTotals.entries()].map(([p,v])=>`<div class="kpi"><div class="lab">${p}</div><div class="val">${v.toLocaleString()}<span class="unit">캔</span></div></div>`).join("");
  kpiEl.innerHTML=`<div class="kpi"><div class="lab">전체 판매수량</div><div class="val">${totQty.toLocaleString()}<span class="unit">캔</span></div></div>`
    +chKpis+prodKpis
    +`<div class="kpi ${stockDays>0?"bad":""}"><div class="lab">결품일</div><div class="val">${stockDays}<span class="unit">일</span></div></div>`
    +`<div class="kpi"><div class="lab">판매일 평균</div><div class="val">${avgDay}<span class="unit">캔/일</span></div></div>`;

  destroyCharts();
  const days=buildDaily(recsM);
  const keys=[...new Set(days.flatMap(d=>[...d.parts.keys()]))];
  const labels=days.map(d=>fmtMD(d.date));
  const grid={color:"#E2E6DB"};
  const baseOpts={responsive:true,maintainAspectRatio:false,
    plugins:{legend:{labels:{font:{size:11,family:"'IBM Plex Sans KR'"},boxWidth:12}}},
    scales:{x:{stacked:true,grid:{display:false},ticks:{font:{size:10},maxRotation:0,autoSkip:true}},
            y:{stacked:true,beginAtZero:true,grid,ticks:{font:{size:10},precision:0}}}};

  charts.daily=new Chart(document.getElementById("dailyChart"),{
    type:"bar",
    data:{labels,datasets:[
      ...keys.map((k,i)=>({label:k,data:days.map(d=>d.parts.get(k)||0),
        backgroundColor:CHCOLOR[k]||productColor(k,i),stack:"s",borderRadius:2,maxBarSize:16})),
      {type:"line",label:"7일 이동평균",data:days.map(d=>d.ma7),
        borderColor:"#39402F",borderWidth:1.5,pointRadius:0,tension:0.3}
    ]},
    options:baseOpts
  });

  const wk=new Map();
  recsM.forEach(r=>{
    const w=mondayOf(r.date);
    if(!wk.has(w)) wk.set(w,{total:0,parts:new Map()});
    const x=wk.get(w); x.total+=r.qty;
    const key=(selChannel==="전체")?r.channel:r.product;
    x.parts.set(key,(x.parts.get(key)||0)+r.qty);
  });
  const wkeys=[...wk.keys()].sort();
  charts.weekly=new Chart(document.getElementById("weeklyChart"),{
    type:"bar",
    data:{labels:wkeys.map(k=>fmtMD(k)+"~"),
      datasets:keys.map((k,i)=>({label:k,data:wkeys.map(w=>wk.get(w).parts.get(k)||0),
        backgroundColor:CHCOLOR[k]||productColor(k,i),stack:"w",borderRadius:2,maxBarSize:30}))},
    options:baseOpts
  });

  const order=["월","화","수","목","금","토","일"];
  const allDaily=buildDaily(scoped);
  const dowAgg=order.map(dw=>{
    const rows=allDaily.filter(d=>d.dow===dw&&!d.stockout);
    const n=rows.length||1;
    const m=new Map();
    rows.forEach(d=>d.parts.forEach((v,k)=>m.set(k,(m.get(k)||0)+v)));
    return {dw,parts:new Map([...m.entries()].map(([k,v])=>[k,+(v/n).toFixed(1)]))};
  });
  charts.dow=new Chart(document.getElementById("dowChart"),{
    type:"bar",
    data:{labels:order,
      datasets:keys.map((k,i)=>({label:k,data:dowAgg.map(d=>d.parts.get(k)||0),
        backgroundColor:CHCOLOR[k]||productColor(k,i),stack:"d",borderRadius:2,maxBarSize:34}))},
    options:baseOpts
  });

  document.getElementById("foot").innerHTML=`논알콜 판매 대시보드 · 내장 기준일 ${SEEDDATA.exportedAt}`;
}

/* ── 관리자 UI ── */

const ADMIN_HASH="6ac69fd9aff1c6697e9bfd95ed53dfe0de58a7eea3e1055b2131884ae98b6cf1";
const SESSION_KEY="nonalcohol_admin";
const STORAGE_KEY="nonalcohol_gsheet_id";

function initAdmin(){
  const area=document.getElementById("adminArea");
  area.innerHTML=`
    <div class="lock-panel">
      <div id="lockForm">
        <div class="gs-label">🔒 관리자 전용</div>
        <div class="lock-row">
          <input type="password" id="lockPw" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter')unlockAdmin()">
          <button onclick="unlockAdmin()">확인</button>
        </div>
        <div id="lockStatus"></div>
      </div>
      <div id="adminInner">
        <div class="gs-label" style="margin-top:10px">🔗 구글 시트 연동 <span class="gs-hint">(시트 ID 또는 URL)</span></div>
        <div class="gs-row">
          <input id="gsInput" type="text" placeholder="시트 ID 또는 공유 URL" spellcheck="false">
          <button id="gsBtn" onclick="connectGSheet()">연결</button>
        </div>
        <div id="gsStatus"></div>
        <button style="margin-top:6px;font-size:11px;background:none;border:none;color:var(--faint);cursor:pointer;padding:0;font-family:inherit" onclick="lockAdmin()">🔒 잠금</button>
      </div>
    </div>`;
  if(sessionStorage.getItem(SESSION_KEY)==="1") showAdmin();
  const saved=localStorage.getItem(STORAGE_KEY)||"";
  if(saved) document.getElementById("gsInput").value=saved;
}

async function sha256(s){
  const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("");
}
async function unlockAdmin(){
  const h=await sha256(document.getElementById("lockPw").value);
  if(h===ADMIN_HASH){ sessionStorage.setItem(SESSION_KEY,"1"); showAdmin(); }
  else{ document.getElementById("lockStatus").textContent="비밀번호가 맞지 않습니다"; document.getElementById("lockPw").value=""; }
}
function showAdmin(){
  document.getElementById("lockForm").style.display="none";
  document.getElementById("adminInner").style.display="block";
}
function lockAdmin(){
  sessionStorage.removeItem(SESSION_KEY);
  document.getElementById("adminInner").style.display="none";
  document.getElementById("lockForm").style.display="";
  document.getElementById("lockPw").value="";
  document.getElementById("lockStatus").textContent="";
}
function extractId(s){ const m=s.match(/\/d\/([a-zA-Z0-9_-]{20,})/); return m?m[1]:(s.trim().length>20?s.trim():""); }
async function connectGSheet(){
  const id=extractId(document.getElementById("gsInput").value.trim());
  if(!id){ alert("올바른 시트 ID 또는 URL을 입력해주세요"); return; }
  const btn=document.getElementById("gsBtn"),st=document.getElementById("gsStatus");
  btn.disabled=true; btn.textContent="연결 중…"; st.textContent="";
  try{
    const res=await fetch("https://docs.google.com/spreadsheets/d/"+id+"/export?format=csv");
    if(!res.ok) throw new Error("응답 오류 "+res.status);
    const recs=parseCSV(await res.text());
    if(!recs.length) throw new Error("유효한 데이터가 없습니다");
    store.clear(); putRecords(recs);
    localStorage.setItem(STORAGE_KEY,id);
    document.getElementById("gsInput").value=id;
    st.textContent="✅ "+recs.length+"건 로드 완료"; st.className="ok";
    render();
  }catch(e){ st.textContent="❌ "+e.message; st.className="err"; }
  finally{ btn.disabled=false; btn.textContent="연결"; }
}
function parseCSV(csv){
  const lines=csv.split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2) throw new Error("데이터가 없습니다");
  const hdr=lines[0].split(",").map(h=>h.trim().replace(/^"|"$/g,""));
  const di=hdr.findIndex(h=>h==="날짜"||h==="date");
  const ci=hdr.findIndex(h=>h==="channel"||h==="채널");
  const pi=hdr.findIndex(h=>h==="product"||h==="상품");
  const qi=hdr.findIndex(h=>h==="qty"||h==="수량");
  const ni=hdr.findIndex(h=>h==="note"||h==="비고");
  if(di<0||ci<0||pi<0||qi<0) throw new Error("필수 컬럼 없음 (날짜/channel/product/qty)");
  const recs=[];
  for(let i=1;i<lines.length;i++){
    const c=lines[i].split(",").map(x=>x.trim().replace(/^"|"$/g,""));
    const d=(c[di]||"").trim();
    if(!/^\d{4}-\d{2}-\d{2}/.test(d)) continue;
    recs.push({date:d.slice(0,10),channel:c[ci]||"",product:c[pi]||"",qty:Number(c[qi])||0,note:ni>=0?c[ni]||"": ""});
  }
  return recs;
}

/* ── 초기 실행 ── */
initAdmin();
render();

(async()=>{
  const saved=localStorage.getItem(STORAGE_KEY)||"";
  if(!saved) return;
  try{
    const res=await fetch("https://docs.google.com/spreadsheets/d/"+saved+"/export?format=csv");
    if(!res.ok) return;
    const recs=parseCSV(await res.text());
    if(recs.length){ store.clear(); putRecords(recs); render(); }
  }catch(e){ console.warn("자동 연동 실패:",e.message); }
})();

</script>
